appId: com.gleech.desktop
productName: GLEECH
directories:
  output: release
files:
  - out/**
  - package.json
asar: true
asarUnpack:
  - node_modules/@img/**
  - node_modules/onnxruntime-node/bin/**
extraResources:
  - from: ../../LICENSE
    to: LICENSE.GLEECH.txt
  - from: ../../THIRD_PARTY_NOTICES.md
    to: THIRD_PARTY_NOTICES.md
  - from: ../../LICENSES
    to: licenses
  - from: out/mcp
    to: mcp
  - from: resources/shaders
    to: shaders
  - from: resources/vector-maps
    to: vector-maps
  - from: resources/depth-maps
    to: depth-maps
  - from: resources/models
    to: models
  - from: resources/branding
    to: branding
  - from: resources/presets
    to: presets
# Shared workspace packages are bundled by Vite into the renderer.
npmRebuild: false
win:
  files:
    - '!**/onnxruntime-node/bin/napi-v6/darwin/**'
    - '!**/onnxruntime-node/bin/napi-v6/linux/**'
    - '!**/onnxruntime-node/bin/napi-v6/win32/arm64/**'
  icon: resources/branding/icon-beta.ico
  target:
    - target: nsis
      arch:
        - x64
  # Apply icon/metadata resources; signing credentials come before public release.
  signExecutable: false
mac:
  category: public.app-category.graphics-design
  icon: resources/branding/icon-beta.png
  identity: null
  files:
    - '!**/onnxruntime-node/bin/napi-v6/win32/**'
    - '!**/onnxruntime-node/bin/napi-v6/linux/**'
    - '!**/onnxruntime-node/bin/napi-v6/darwin/x64/**'
  target:
    - target: zip
      arch:
        - arm64
  artifactName: GLEECH-${version}-mac-${arch}.${ext}
linux:
  executableName: gleech
  category: Graphics
  icon: resources/branding/icon-beta.png
  files:
    - '!**/onnxruntime-node/bin/napi-v6/win32/**'
    - '!**/onnxruntime-node/bin/napi-v6/darwin/**'
    - '!**/onnxruntime-node/bin/napi-v6/linux/arm64/**'
  target:
    - target: AppImage
      arch:
        - x64
  artifactName: GLEECH-${version}-linux-${arch}.${ext}
nsis:
  installerIcon: resources/branding/icon-beta.ico
  uninstallerIcon: resources/branding/icon-beta.ico
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
artifactName: GLEECH-${version}-${arch}-setup.${ext}
