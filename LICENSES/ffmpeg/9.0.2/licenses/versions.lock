# ---------------------------------------------------------------------------
# versions.lock -- THE single source of truth for every pinned input.
#
# Format: plain `KEY=value` shell assignments. No command substitution, no
# expansion of other variables, so this file is equally parseable from bash
# (`sed -n 's/^KEY=//p'`), PowerShell, Python and GitHub Actions -- the same
# contract nelux's own tools/ffmpeg.lock already uses, on purpose.
# scripts/lib/common.sh load_lock() validates the whole file against that
# grammar before sourcing it.
#
# Every third-party source is pinned by BOTH a human-readable tag AND an
# immutable commit SHA (or, for FFmpeg, a tarball SHA256). The build scripts
# verify the SHA after fetching and abort on mismatch -- a moved tag is a
# build failure, not a silent substitution.
#
# To bump anything: edit ONLY this file, then run
#     ./scripts/fetch-sources.sh    (fails loudly if a tag moved or a hash changed)
#     ./scripts/validate-flags.sh   (fails if a new FFmpeg renamed a component)
# and open a PR. Nothing else in the repo hardcodes a version.
#
# Last verified: 2026-08-04
# ---------------------------------------------------------------------------

# ===========================================================================
# FFmpeg
# ===========================================================================
# Release tarball is the primary source (deterministic, no git needed).
# The git tag/commit are recorded so the exact tree can be reconstructed and
# so `git describe` inside the source archive is meaningful.
FFMPEG_VERSION=9.0.2
FFMPEG_TAG=n9.0.2
# `git rev-parse n9.0.2^{}` -- the commit the annotated tag points at.
FFMPEG_COMMIT=946fcce07b6dcd0331c8cc609192aeff5e1924f8
# The annotated tag object itself, from `git ls-remote` against the GitHub
# mirror on 2026-10-04.
FFMPEG_TAG_OBJECT=ce8f11b9fac4cd7ccfb41ca7c01bc17f5cda8cc3
FFMPEG_URL=https://ffmpeg.org/releases/ffmpeg-9.0.2.tar.xz
# VERIFIED: computed locally with sha256sum on the file downloaded from
# ffmpeg.org on 2026-10-04 (12,040,788 bytes). The detached signature
# verified "Good signature" against FCF986EA...D67658D8 the same day.
# NOTE: ffmpeg.org publishes .asc (PGP) signatures, NOT .sha256 files -- there
# is no upstream SHA256 to cross-check against. scripts/fetch.sh therefore
# ALSO verifies ffmpeg-9.0.2.tar.xz.asc against the FFmpeg release key when
# gpg is available. Treat the SHA256 below as "pinned by us", and the PGP
# signature as the upstream trust root.
FFMPEG_SHA256=8c3850283eb25fa026482078a04051e0be17347b09ef81a0849bec15a96e002e
FFMPEG_SIG_URL=https://ffmpeg.org/releases/ffmpeg-9.0.2.tar.xz.asc
# FFmpeg release signing key fingerprint (Michael Niedermayer).
FFMPEG_GPG_FPR=FCF986EA15E6E293A5644F10B4322F04D67658D8

# SONAME majors produced by this FFmpeg. Asserted by scripts/verify-output.sh
# after every build: if one of these changes, downstream consumers that
# hardcode a DLL/so name break, so the build must fail loudly.
# Read from lib*/version_major.h (libavutil/version.h for avutil) in the
# 9.0.2 tarball. Every major moved from 8.1.2 -- 9.0 is an ABI break.
SONAME_AVCODEC=63
SONAME_AVDEVICE=63
SONAME_AVFILTER=12
SONAME_AVFORMAT=63
SONAME_AVUTIL=61
SONAME_SWRESAMPLE=7
SONAME_SWSCALE=10

# ===========================================================================
# nv-codec-headers (NVENC / NVDEC / CUVID stub headers)
# ===========================================================================
# *** THIS SINGLE VARIABLE SETS THE MINIMUM NVIDIA DRIVER VERSION FOR EVERY
# *** NVENC/NVDEC FEATURE IN THIS BUILD. See README.md#nvidia-driver-floor.
#
#   n11.1.5.3   -> Linux >= 470.57.02 / Windows >= 471.41
#   n12.1.14.0  -> Linux >= 530.41.03 / Windows >= 531.61   <-- CHOSEN
#   n13.0.19.0  -> Linux >= 570.0     / Windows >= 570.0
#
# ffmpeg-9.0.2/configure:7214-7216 accepts, in order of preference:
#   ffnvcodec >= 12.1.14.0            (unbounded upper -- 13.x also matches)
#   ffnvcodec >= 12.0.16.1  < 12.1
#   ffnvcodec >= 11.1.5.3   < 12.0
# (9.0 dropped the 11.0.x and 8.1.x brackets 8.1.2 still accepted.)
#
# We choose n12.1.14.0: it is the lowest version in FFmpeg's *preferred*
# bracket, so we get every NVENC/NVDEC feature FFmpeg 9.0.2 knows how to use
# (incl. AV1 NVENC, which needs >= 12.0), while keeping the driver floor at
# 531.61 (Mar 2023) instead of 570.x (Jan 2025). Bumping to n13.0.19.0 would
# cut off every user on a 2023-2024 driver for no feature nelux or TAS uses.
NVCODEC_TAG=n12.1.14.0
NVCODEC_COMMIT=1889e62e2d35ff7aa9baca2bceb14f053785e6f1
NVCODEC_REPO=https://github.com/FFmpeg/nv-codec-headers.git
NVCODEC_DRIVER_MIN_LINUX=530.41.03
NVCODEC_DRIVER_MIN_WINDOWS=531.61

