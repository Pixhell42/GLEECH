# --- MP3 and Vorbis: SAFETY NET, not a consumer requirement -----------------
# Neither is named by nelux, TheAnimeScripter, TAS-Standalone or
# TAS-AdobeEdition. Both are here because they close a gap a user can walk
# into through free text:
#   * TAS-Standalone's `custom_encoder` is an unvalidated text field
#     (src/shared/schema.ts:462 -> buildArgs.ts:102-107 -> the backend's
#     ffmpegSettings.py:825 whitespace split), so `-c:a libmp3lame` reaches
#     the command line verbatim;
#   * WITHOUT libmp3lame there is NO MP3 ENCODER AT ALL on Linux and macOS.
#     Windows happens to have `mp3_mf` from MediaFoundation, which is exactly
#     the kind of platform asymmetry this repo exists to remove.
#   * FFmpeg's NATIVE `vorbis` encoder is marked experimental and refuses to
#     open without `-strict -2`, so "the codec exists" was never the same as
#     "a user can encode Vorbis".
# libmp3lame also changes what av_guess_codec() returns for matroska (mp3
# rather than ac3), which nelux's audio passthrough consults at
# Nelux/src/Nelux/backends/Encoder.cpp:390.
#
# LAME has no git upstream, so this one is a verified tarball.
# LICENSE: LGPL-2.1-or-later. configure:7398 does a plain `require`, NOT
# pkg-config -- LAME installs no .pc file.
LAME_VERSION=3.100
LAME_URL=https://downloads.sourceforge.net/project/lame/lame/3.100/lame-3.100.tar.gz,https://sourceforge.net/projects/lame/files/lame/3.100/lame-3.100.tar.gz/download
