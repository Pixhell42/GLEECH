# ---------------------------------------------------------------------------
# Vulkan -- Windows + Linux (both arches). Not macOS: no Vulkan driver ships
# with it, and MoltenVK has no Vulkan Video, so there is nothing to test on.
# ---------------------------------------------------------------------------
# NOTHING here is linked. libavutil/hwcontext_vulkan.c:650-682 dlopen()s the
# loader at runtime (vulkan-1.dll / libvulkan.so.1) exactly like the NVIDIA
# and AMF stubs, so a machine without Vulkan still loads FFmpeg fine and the
# import / DT_NEEDED allowlists in scripts/verify-output.sh stay unchanged.
#
# All three repos are pinned to the SAME Vulkan SDK release tag, i.e. a set
# Khronos tested together. The tags are lightweight, so _COMMIT is the tag's
# own target (`git ls-remote`, 2026-10-04).
#
# Vulkan-Headers -- header-only. ffmpeg-9.0.2/configure:7804-7806 needs
# VK_VERSION_1_3 with VK_HEADER_VERSION >= 277 (no vulkan.pc required: the
# fallback is a plain check_cpp_condition on the include path), and
# configure:7849-7850 enables `vulkan_1_4` -- which vp9_vulkan_hwaccel_deps
# (configure:3547) requires -- only for VK_VERSION_1_4 with VK_HEADER_VERSION
# >= 317. 1.4.363 clears both.
# LICENSE: every header we compile in is SPDX "Apache-2.0 OR MIT"; we take
# MIT, which keeps the binaries GPL-2.0-or-later.
VULKAN_HEADERS_TAG=vulkan-sdk-1.4.363.0
VULKAN_HEADERS_COMMIT=6802bb4733b63ed5efd3adb308a6c885ef180ea1
VULKAN_HEADERS_REPO=https://github.com/KhronosGroup/Vulkan-Headers.git

# SPIRV-Headers -- header-only. OPTIONAL to configure, which is exactly why
# it is pinned: without it configure:7858-7861 only WARNS ("spirv-headers not
# found, swscale SPIR-V backend unavailable") and swscale silently loses its
# Vulkan backend (libswscale/vulkan/ops.c gates on HAVE_SPIRV_*_SPIRV_H).
# verify-output.sh asserts HAVE_SPIRV_UNIFIED1_SPIRV_H. LICENSE: MIT-style
# (Khronos).
SPIRV_HEADERS_TAG=vulkan-sdk-1.4.363.0
SPIRV_HEADERS_COMMIT=496543121ce6419f23d6fa5d7194ba66c36212d2
SPIRV_HEADERS_REPO=https://github.com/KhronosGroup/SPIRV-Headers.git

# glslang -- a HOST BUILD TOOL, not a library: nothing of it is linked. FFmpeg
# 9.0 compiles its GLSL compute shaders to SPIR-V at BUILD time and embeds the
# bytecode in libavcodec/libavfilter/libswscale. Without a compiler,
# configure:7809-7831 silently disables `spirv_compiler`, and with it all 18
# *_vulkan filters, the ffv1_vulkan/prores_ks_vulkan encoders and five Vulkan
# hwaccels -- with NO error. `spirv_compiler` is in no list configure prints,
# so config.h cannot prove it; the component contract (scale_vulkan,
# ffv1_vulkan in flags/required-components.txt) does.
# Built from source rather than taken from a package manager because (a) the
# SPIR-V it emits ends up in the shipped libraries, so its version is part of
# what we ship, and (b) EL8's packaged glslang predates the
# `--glsl-version 460` / `--target-env spirv1.6` / `--depfile` flags configure
# passes. scripts/build-ffmpeg.sh hands configure this exact binary via
# --glslc= so a system glslc on PATH can never be picked instead.
# Pre-flight: all 58 *.comp.glsl in ffmpeg-9.0.2 compiled cleanly with
# configure's exact flags under glslang 16.2.0; this pin is 16.6.0.
# LICENSE: BSD-3-Clause / Apache-2.0 / MIT mix (its own LICENSE.txt). Its
# source is shipped in the corresponding-source archive anyway, like
# Implib.so, because its OUTPUT is in the binaries.
GLSLANG_TAG=vulkan-sdk-1.4.363.0
GLSLANG_COMMIT=e1b562a8bed273a02f30b59b66a5d499793cede5
GLSLANG_REPO=https://github.com/KhronosGroup/glslang.git

# ---------------------------------------------------------------------------
# VAAPI stack -- linux/x86_64 ONLY, and NOT linked the way it looks.
#
# WHY VAAPI IS IN THE BUILD AT ALL: on Linux the QSV hwcontext creates a VAAPI
# CHILD DEVICE at runtime, so `-init_hw_device qsv` fails without vaapi
# compiled in even though the encoders exist. h264_qsv, hevc_qsv and vp9_qsv
# are all REQUIRED on linux/x86_64 (flags/required-components.txt:108-110,
# 179-180), so --enable-vaapi in flags/ffmpeg.linux.flags:39 is not optional.
# Not on aarch64: flags/ffmpeg.linux.arm64.flags:41 passes --disable-vaapi
# because there is no aarch64 QSV runtime for it to serve.
#
# WHY THAT IS A PROBLEM: linking libva the ordinary way puts
#     DT_NEEDED libva.so.2, libva-drm.so.2, libdrm.so.2
# into libavutil.so.60. None of the three is in the manylinux_2_28 policy set,
# so `auditwheel repair` either vendors them into nelux's wheel or rejects the
# wheel outright, and TAS's spawned bin/ffmpeg fails to start on any machine
# without libva installed. scripts/verify-output.sh's DT_NEEDED allowlist
# names libva.so.2 explicitly as something that must never appear, and it is
# right to: neither consumer ships it.
#
# WHAT WE DO INSTEAD: build libva from this pin, then replace libva.so.2 and
# libva-drm.so.2 with STATIC STUB ARCHIVES generated by Implib.so and DELETE
# the shared objects (scripts/build-deps.sh build_libva, via
# scripts/lib/gen-implib.sh). The stub defines every VA entry point as a
# trampoline that dlopen()s the real libva.so.2 on the first call, so the
# shipped binaries carry NO DT_NEEDED for any of it, and a machine that never
# asks for QSV never reaches the dlopen. This is exactly how
# BtbN/FFmpeg-Builds solves it (scripts.d/50-vaapi/*.sh and
# images/base-linux64/gen-implib.sh, MIT).
#
# libva is pinned rather than taken from AlmaLinux's libva-devel for the same
# reason bzip2 and xz are (see docker/Dockerfile.manylinux_2_28): the stub
# archive is compiled INTO the shipped libavutil.so, so its contents must come
# from a pinned input, and leaving the -devel package out of the image is what
# guarantees a regression cannot silently resolve `-lva` against a system .so
# instead.
LIBVA_TAG=2.24.1
# NOTE: 2.24.1 is an ANNOTATED tag, so `git ls-remote --tags` prints TWO
# lines for it: the tag OBJECT (5a99f4a...) and the COMMIT it points at
# (710eb46..., the `^{}` row). A checkout lands on the COMMIT, so that is
# what belongs here -- recording the tag object made fetch_git abort with
#   post-checkout HEAD is 710eb465..., expected 5a99f4a1...
# Always take the `^{}` value. Audited 2026-08-05: libva was the only one
# of the 15 real-tag pins with this mistake.
LIBVA_COMMIT=710eb465c6277ee2cac3e6948767b01eebe7e77a
LIBVA_REPO=https://github.com/intel/libva.git

# libdrm is a BUILD-TIME PREREQUISITE OF LIBVA, not a feature of ours.
# libva/meson.build:88 does
#     dependency('libdrm', version : '>= 2.4.75', required : true)
# on every non-Windows host, and libva-drm.pc then carries libdrm through to
# FFmpeg's link line because scripts/build-ffmpeg.sh passes
# --pkg-config-flags=--static. We do NOT pass --enable-libdrm
# (flags/ffmpeg.linux.flags:89), so no FFmpeg code references a drm* symbol
# and the static archive below contributes ZERO objects to the link -- it
# exists only so `-ldrm` resolves to something that is not the system
# libdrm.so.2.
#
# DELIBERATELY STATIC, where BtbN stub it with Implib.so: their builds pass
# --enable-libdrm (kmsgrab, DRM-prime interop) so their libavutil really does
# call into libdrm and needs the lazy dlopen. Ours does not, and a static
# archive that nothing references is strictly less machinery than a stub --
# no trampolines, no dlopen, and no abort() path (see gen-implib.sh).
#
# BtbN's libpciaccess recipe is therefore NOT ported: it exists only to
# satisfy libdrm's -Dintel=enabled KMS helper (libdrm_intel), which nothing
# in this build links.
LIBDRM_TAG=libdrm-2.4.134
LIBDRM_COMMIT=e984d448b8b17aab853369e6c203e53719f46de1
LIBDRM_REPO=https://gitlab.freedesktop.org/mesa/drm.git

# Implib.so -- the stub generator. MIT, and a genuine SHIPPED COMPONENT, not
# merely a build tool: the trampolines and the dlopen shim it emits are
# compiled into libavutil.so.60, so its licence has to travel with the
# binaries (scripts/package.sh collects it automatically from this pin).
#
# Pinned by commit because upstream publishes no tags at all. The TAG below is
# a date label, like X264_TAG -- it is documentation, not something anything
# resolves.
IMPLIB_TAG=master@2026-08-01
IMPLIB_COMMIT=a3e167cf978a5b8a38ec0f710d8c4331e8dcdd9a
IMPLIB_REPO=https://github.com/yugr/Implib.so.git

# ===========================================================================
# Compression (required, not optional)
# ===========================================================================
# zlib is NOT a nice-to-have. With --disable-autodetect (see
# profiles/common.flags) it is OFF unless explicitly enabled, and without it
# the png/apng encoders+decoders, ffv1, flashsv, the matroska and mov muxers'
# compressed-header paths, and several image decoders all silently vanish.
# We build it FROM SOURCE as a static library on Windows so the produced
# libav* DLLs do not acquire a runtime dependency on MSYS2's zlib1.dll --
# which would be fatal for nelux, whose wheel bundles only av*/sw* DLLs.
ZLIB_TAG=v1.3.1
ZLIB_COMMIT=51b7f2abdade71cd9bb0e7a373ef2610ec6f9daf
ZLIB_REPO=https://github.com/madler/zlib.git

# ---------------------------------------------------------------------------
# bzip2 / xz(liblzma) / libiconv -- WINDOWS + LINUX, from source
# ---------------------------------------------------------------------------
# flags/ffmpeg.flags:181-186 asks for --enable-bzlib, --enable-lzma and
# --enable-iconv on every platform. Until now nothing built them, so they were
# satisfied from whatever the build environment happened to provide:
#
#   Windows  MSYS2 ships libbz2.dll.a / liblzma.dll.a / libiconv.dll.a
#            ALONGSIDE the static .a, and GNU ld prefers the .dll.a. The
#            produced avcodec-62.dll / avformat-62.dll would then import
#            libbz2-1.dll, liblzma-5.dll and libiconv-2.dll -- none of which
#            nelux's wheel ships (it bundles only av*/sw*), so every import
#            of nelux would fail with a missing-DLL error on a machine that
#            has no MSYS2.
#   Linux    docker/Dockerfile.manylinux_2_28 installed bzip2-devel and
#            xz-devel, which on AlmaLinux 8 provide only the SHARED libs, so
#            libavformat.so.62 acquired DT_NEEDED libbz2.so.1 / liblzma.so.5.
#            Those are outside the manylinux_2_28 policy set, so auditwheel
#            would drag them into (or reject) the nelux wheel.
#
# Both are the same failure the zlib pin above already exists to prevent, and
# the answer is the same: pin them and build them static, rather than widening
# scripts/verify-output.sh's import allowlist. Taking a shipped library from
# the build image is exactly the non-determinism --disable-autodetect exists
# to forbid.
#
# NOT built on macOS: there bzlib, lzma and iconv come from /usr/lib and the
# SDK, i.e. from the operating system, on the same footing as SecureTransport
# and VideoToolbox. verify-output.sh's macOS allowlist already permits
# /usr/lib, and building a second copy would add risk without adding
# determinism.
#
# All three SHA256s were computed locally on 2026-08-04 from the file
# downloaded from the URL below, and then CROSS-CHECKED against an
# independent mirror (tukaani.org and SourceForge for xz, mirrors.kernel.org
# for libiconv) that returned a byte-identical archive.

# bzip2 1.0.8 is the current and final release of the 1.0 series (2019).
# LICENSE: BSD-style (bzip2-1.0.6 licence). No GPL interaction.
#
# *** TRAP: bzlib.h:78-95 -- READ BEFORE TOUCHING THE WINDOWS BUILD ***
# On _WIN32, when BZ_EXPORT is NOT defined, bzlib.h declares every entry
# point as a FUNCTION POINTER, not a function:
#     #define BZ_API(func) (WINAPI * func)
#     #define BZ_EXTERN
# so `BZ_EXTERN int BZ_API(BZ2_bzlibVersion) (void);` becomes a tentative
# definition of a NULL pointer variable. FFmpeg's configure check
# (`check_lib bzlib bzlib.h BZ2_bzlibVersion -lbz2`) still COMPILES AND LINKS
# against that -- so the check passes, the build succeeds, and matroska
# bzlib decompression calls a null pointer at runtime. scripts/build-deps.sh
# therefore compiles bzip2 with -DBZ_EXPORT and scripts/build-ffmpeg.sh adds
# -DBZ_EXPORT to --extra-cflags on Windows. (WINAPI is __stdcall, which is a
# no-op on x86-64, so the ABI is unchanged.) Distro packages, MSYS2's
# included, patch this header; we build vanilla source, so we must not.
BZIP2_VERSION=1.0.8
BZIP2_URL=https://sourceware.org/pub/bzip2/bzip2-1.0.8.tar.gz,https://ftp.osuosl.org/pub/blfs/conglomeration/bzip2/bzip2-1.0.8.tar.gz
BZIP2_SHA256=ab5a03176ee106d3f0fa90e381da478ddae405918153cca248e682cd0c4a2269

# xz / liblzma. Pinned to the 5.4 series ON PURPOSE: 5.6.0 and 5.6.1 are the
# releases that carried the CVE-2024-3094 backdoor, which was introduced in
# the RELEASE TARBALL's build machinery rather than in the git tree. 5.4.7 is
# the last 5.4.x, was cut by the post-incident maintainers, and predates the
# affected build system entirely. liblzma is the only part we use.
# LICENSE: 0BSD for liblzma (public-domain-equivalent). No GPL interaction.
# NOTE: lzma.h:189-195 makes __declspec(dllimport) conditional on
# `!defined(__GNUC__)`, so a MinGW static link needs NO -DLZMA_API_STATIC.
XZ_VERSION=5.4.7
XZ_URL=https://github.com/tukaani-project/xz/releases/download/v5.4.7/xz-5.4.7.tar.xz
XZ_SHA256=016182c70bb5c7c9eb3465030e3a7f6baa25e17b0e8c0afe92772e6021843ce2

# GNU libiconv -- WINDOWS ONLY at build time (glibc and macOS's libSystem both
# provide iconv; only mingw does not).
#
# *** WHY THIS IS NOT OPTIONAL ON WINDOWS ***
# configure:4790-4794 -- under --disable-autodetect, and unless iconv is
# explicitly disabled, configure sets `libc_iconv`. configure:7907-7911 then
# reads:
#     if enabled libc_iconv; then
#         check_func_headers iconv.h iconv
#     elif enabled iconv; then
#         check_func_headers iconv.h iconv || check_lib iconv iconv.h iconv -liconv
#     fi
# Because libc_iconv wins, the `-liconv` fallback is NEVER REACHED in our
# configuration. check_func_headers only ENABLES on success (configure:1500),
# and configure:8359-8361 then does
#     requested $lib && ! enabled $lib && die "ERROR: $lib requested but not found"
# so on mingw -- where iconv is not in the C library -- configure DIES.
# scripts/build-ffmpeg.sh therefore passes `--extra-libs=-liconv` on Windows,
# which test_ld appends to the probe's link line, so the libc probe links
# against the static libiconv.a built here and succeeds.
# LICENSE: the libiconv LIBRARY is LGPL-2.1-or-later (the iconv command-line
# program is GPL, and we do not build or ship it: --disable-shared plus we
# install only the library). LGPL-2.1 is GPL-2.0 compatible, so this does not
# move the output off GPL-2.0-or-later and does NOT drag in version3.
LIBICONV_VERSION=1.18
LIBICONV_URL=https://ftp.gnu.org/pub/gnu/libiconv/libiconv-1.18.tar.gz
LIBICONV_SHA256=3b08f5f4f9b4eb82f151a7040bfd6fe6c6fb922efe4b1659c66ea933276965e8

# ===========================================================================
# Build/CI environment pins
# ===========================================================================
# Linux MUST be built in manylinux_2_28 (glibc 2.28). nelux ships
# manylinux_2_28 wheels and auditwheel REJECTS shared libs that reference a
# newer glibc symbol version. Building on ubuntu-latest would produce
# libavutil.so.60 with GLIBC_2.34 references and break the wheel repair step.
#
# TWO ARCHES. nelux ships Linux/aarch64 too (tools/ffmpeg.lock:113-119
# LINUXARM64_BTBN_*), so there is a manylinux_2_28_aarch64 build as well --
# without it that platform keeps a BtbN fallback whose autobuild tag WILL be
# pruned. Both images are AlmaLinux 8 + devtoolset: new compiler, old libc.
#
# Pinned to a DATED tag rather than :latest, plus the digest that tag resolved
# to. Both digests were obtained on 2026-08-04 from
#   https://quay.io/api/v1/repository/pypa/manylinux_2_28_<arch>/tag/?onlyActiveTags=true
# -- not guessed. The build scripts do not enforce the digest today (docker
# does that if you write FROM image@digest); it is recorded so a reviewer can
# tell whether a rebuild used the same base.
# CAVEAT: quay.io GCs untagged manifests, so a very old digest may eventually
# become unpullable. The dated tag is the primary pin.
MANYLINUX_IMAGE_X86_64=quay.io/pypa/manylinux_2_28_x86_64:2026.08.02-2
MANYLINUX_DIGEST_X86_64=sha256:622a0041b2daf9865d38d7a14ae913a66d103db7b15fdedbcf513353d106183e
MANYLINUX_IMAGE_AARCH64=quay.io/pypa/manylinux_2_28_aarch64:2026.08.02-2
MANYLINUX_DIGEST_AARCH64=sha256:5bf033a700fd265da5cca83c0fa379810b8a4b516a2ec432f1a2b51dca4346cf

# macOS deployment targets. 11.0 is the first arm64 macOS.
MACOSX_DEPLOYMENT_TARGET_ARM64=11.0
MACOSX_DEPLOYMENT_TARGET_X86_64=10.15

# MSYS2 environment used for the Windows build (mingw64 / UCRT64).
# FFmpeg CANNOT be built with MSVC -- it needs a C99/C11 compiler with GNU
# inline asm and a POSIX shell. The DLLs are still fully consumable from MSVC.
MSYS2_MSYSTEM=MINGW64
