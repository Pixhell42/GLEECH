# ===========================================================================
# Text rendering -- SAFETY NET (subtitle BURN-IN and drawtext)
# ===========================================================================
# READ THIS FIRST, because it is easy to add for the wrong reason:
# subtitle PASSTHROUGH and subtitle TRANSCODE need NONE of these. mov_text,
# webvtt, ass, subrip and text are native FFmpeg codecs, which is what
# TheAnimeScripter uses (-c:s webvtt / -c:s mov_text, src/io/ffmpegSettings
# .py:848-859) and what nelux uses (AV_CODEC_ID_MOV_TEXT/WEBVTT/ASS/SUBRIP/
# TEXT, src/Nelux/backends/Encoder.cpp:522-524). Those paths work without a
# single library below.
#
# What these four buy is RENDERING: the `subtitles=` and `ass` filters, which
# BURN subtitles into the video, and `drawtext`. No consumer calls them today
# -- they are reachable only through free text (see the LAME note above).
#
# Build order is load-bearing: freetype -> harfbuzz -> fribidi -> libass.
# harfbuzz must be built WITH freetype because libass's shaper includes
# hb-ft.h; libass then needs all three.
#
# fontconfig is DELIBERATELY ABSENT. It would drag in expat and gperf, and --
# the real reason -- it resolves fonts through a system-wide config file,
# which a relocatable archive cannot rely on. Consequence, stated plainly:
# on Linux, `subtitles=` cannot look a font up BY NAME; it works with fonts
# embedded in the container, with an explicit fontsdir=, and with fontfile=
# on drawtext. Windows (DirectWrite) and macOS (CoreText) have a native font
# provider and are unaffected.
#
# LICENCE NOTE -- FreeType is dual-licensed FTL or GPL-2.0-or-later. The FTL
# is GPLv3-compatible but NOT GPLv2-compatible, so we take FreeType under its
# GPL-2.0-or-later option, which is what keeps these binaries
# GPL-2.0-or-later rather than forcing GPLv3. scripts/package.sh ships both
# licence texts from the source tree. The others are permissive:
# harfbuzz Old-MIT, FriBidi LGPL-2.1-or-later, libass ISC.
FREETYPE_TAG=VER-2-14-3
FREETYPE_COMMIT=0a0221a1347e2f1e07c395263540026e9a0aa7c7
FREETYPE_REPO=https://gitlab.freedesktop.org/freetype/freetype.git

