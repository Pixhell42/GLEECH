name: Installed 0.2.0 candidate acceptance

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/installed-acceptance.yml
      - tooling/installed-acceptance-*.mjs
      - tooling/installed-package-check.mjs

permissions:
  contents: read
  actions: read

concurrency:
  group: installed-acceptance-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native:
    name: Installed ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-arm64
            runner: macos-15
          - target: darwin-x64
            runner: macos-15-intel
          - target: linux-x64
            runner: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Download and verify the approved candidate (no rebuild)
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_TARGET: ${{ matrix.target }}
        run: |
          node -e "require('node:assert/strict').equal(process.platform + '-' + process.arch, process.env.EXPECTED_TARGET)"
          node tooling/installed-acceptance-fetch.mjs
      - run: pnpm install --frozen-lockfile
      - name: Install Linux desktop prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libfuse2 xvfb libgtk-3-0 libnss3 libasound2
      - name: Install the verified package at a stable location
        run: node tooling/installed-package-check.mjs install
      - name: Exercise installed macOS application and terminal setup
        if: runner.os == 'macOS'
        run: node tooling/installed-package-check.mjs exercise
      - name: Exercise installed Linux AppImage and terminal setup
        if: runner.os == 'Linux'
        run: xvfb-run -a node tooling/installed-package-check.mjs exercise
      - name: Remove the tested application and verify artwork survives
        run: node tooling/installed-package-check.mjs uninstall
      - name: Retain acceptance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: installed-acceptance-${{ matrix.target }}-${{ github.sha }}
          path: |
            test-results/installed-acceptance/${{ matrix.target }}/report.json
            test-results/installed-acceptance/${{ matrix.target }}/*.png
            test-results/installed-acceptance/${{ matrix.target }}/artwork/*
          if-no-files-found: error
          retention-days: 30
