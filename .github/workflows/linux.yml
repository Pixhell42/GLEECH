name: Linux Omarchy alpha build

on:
  workflow_dispatch:
  pull_request:
    paths:
      - apps/desktop/src/**
      - packages/**
      - tooling/support-check.mjs
      - tooling/github-feedback-check.mjs
      - tooling/updates-check.mjs
      - tooling/terminal-updates-check.mjs
      - tooling/update-package-*.mjs
      - .github/workflows/linux.yml
      - apps/desktop/electron-builder.yml
      - packages/*/src/**
      - tooling/timeline-*.mjs
      - tooling/file-action.mjs
      - tooling/test-electron.mjs
      - tooling/capture-test-window.mjs
      - tooling/close-test-app.mjs
      - apps/desktop/package.json
      - apps/desktop/src/main/mcp*.ts
      - apps/desktop/src/main/feedback-auth-store*.ts
      - apps/desktop/src/shared/mcp-clients.ts
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - tooling/linux-*.mjs
      - tooling/*ffmpeg*.mjs
      - apps/desktop/build/ffmpeg-before-pack.mjs
      - apps/desktop/build/after-pack.mjs
      - apps/desktop/src/main/ffmpeg*.ts
      - LICENSES/ffmpeg/**
      - tooling/mac-native-review.mjs
      - tooling/appimage-check.mjs
      - tooling/run-linux-webgpu.sh
      - tooling/cli-*.mjs
      - apps/desktop/build/cli-after-pack.mjs
      - apps/desktop/resources/cli/**
      - apps/desktop/src/cli/**
      - apps/desktop/src/main/cli-gpu-main.ts
      - apps/desktop/src/preload/cli-gpu.ts
      - apps/desktop/src/renderer/cli-gpu.html
      - apps/desktop/src/renderer/src/cli-gpu.ts
      - apps/desktop/src/shared/cli-gpu-api.ts
      - apps/desktop/cli.vite.config.ts

permissions:
  contents: read

env:
  ROARR_LOG: 'false'
  CSC_IDENTITY_AUTO_DISCOVERY: 'false'

concurrency:
  group: linux-alpha-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Linux x64 AppImage
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Require native Linux x64
        run: node -e "require('node:assert/strict').equal(process.platform, 'linux'); require('node:assert/strict').equal(process.arch, 'x64')"
      - run: pnpm install --frozen-lockfile
      - name: Check production dependency advisories
        run: pnpm audit --prod
      - name: Install AppImage and test display prerequisites
        run: sudo apt-get update && sudo apt-get install -y libfuse2 xvfb libgtk-3-0 libnss3 libasound2
      - name: Build native Linux AppImage
        run: pnpm dist:linux
      - name: Verify native binaries and original notices
        id: package
        run: |
          node tooling/linux-package-check.mjs
          node tooling/ffmpeg-package-check.mjs apps/desktop/release/linux-unpacked/resources
          node -e "const fs = require('node:fs'); const { archive } = JSON.parse(fs.readFileSync('apps/desktop/release/linux-build-x64.json', 'utf8')); fs.appendFileSync(process.env.GITHUB_OUTPUT, 'appimage=apps/desktop/release/' + archive + '\n');"
      - name: Formatting, lint, types and unit tests
        run: pnpm check
      - name: Test unpacked image rendering and MCP clients
        run: |
          node tooling/update-package-check.mjs apps/desktop/release/linux-unpacked/resources apps/desktop/release
          xvfb-run -a node tooling/image-check.mjs apps/desktop/release/linux-unpacked/gleech --cpu
          xvfb-run -a node tooling/ffmpeg-check.mjs apps/desktop/release/linux-unpacked/gleech-bin
          xvfb-run -a node tooling/mcp-clients-check.mjs apps/desktop/release/linux-unpacked/gleech
          xvfb-run -a node tooling/cli-check.mjs apps/desktop/release/linux-unpacked/gleech-bin --cpu --require-ffmpeg
          node tooling/cli-launcher-check.mjs apps/desktop/release/linux-unpacked/gleech
          xvfb-run -a node tooling/updates-check.mjs apps/desktop/release/linux-unpacked/gleech
          xvfb-run -a node tooling/terminal-updates-check.mjs apps/desktop/release/linux-unpacked/gleech-bin
          xvfb-run -a node tooling/open-file-check.mjs apps/desktop/release/linux-unpacked/gleech-bin
          xvfb-run -a node tooling/support-check.mjs apps/desktop/release/linux-unpacked/gleech --cpu
          xvfb-run -a node tooling/github-feedback-check.mjs apps/desktop/release/linux-unpacked/gleech --cpu --allow-unavailable-keyring
      - name: Test actual AppImage startup, MCP and remount
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
          GLEECH_APPIMAGE: ${{ steps.package.outputs.appimage }}
        run: |
          xvfb-run -a node tooling/smoke.mjs "$GLEECH_APPIMAGE"
          xvfb-run -a node tooling/mcp-check.mjs "$GLEECH_APPIMAGE" --cpu
          xvfb-run -a node tooling/appimage-check.mjs "$GLEECH_APPIMAGE"
          node tooling/cli-launcher-check.mjs "$GLEECH_APPIMAGE"
      - name: Test actual AppImage timeline and media
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
          GLEECH_APPIMAGE: ${{ steps.package.outputs.appimage }}
        run: |
          xvfb-run -a node tooling/timeline-check.mjs "$GLEECH_APPIMAGE" --cpu --require-ffmpeg
          xvfb-run -a node tooling/timeline-media-check.mjs "$GLEECH_APPIMAGE" --cpu --require-ffmpeg
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gleech-linux-omarchy-alpha-x64-${{ github.sha }}
          path: |
            ${{ steps.package.outputs.appimage }}
            apps/desktop/release/linux-build-x64.json
            apps/desktop/release/SHA256SUMS-linux-x64.txt
            apps/desktop/release/latest-x64-linux.yml
            apps/desktop/release/*.blockmap
          if-no-files-found: error
          retention-days: 14
