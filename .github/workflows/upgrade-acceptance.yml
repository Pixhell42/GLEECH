name: Published 0.1.2 to 0.2.0 upgrade acceptance

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/upgrade-acceptance.yml
      - tooling/upgrade-acceptance-*.mjs
      - tooling/upgrade-package-check.mjs

permissions:
  contents: read

concurrency:
  group: upgrade-acceptance-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  native:
    name: Upgrade ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: win32-x64
            runner: windows-latest
          - target: darwin-arm64
            runner: macos-15
          - target: darwin-x64
            runner: macos-15-intel
          - target: linux-x64
            runner: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Download both published versions and verify their pinned hashes
        env:
          EXPECTED_TARGET: ${{ matrix.target }}
        run: |
          node -e "require('node:assert/strict').equal(process.platform + '-' + process.arch, process.env.EXPECTED_TARGET)"
          node tooling/upgrade-acceptance-fetch.mjs
      - run: pnpm install --frozen-lockfile
      - name: Install Linux desktop prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libfuse2 xvfb libgtk-3-0 libnss3 libasound2
      - name: Exercise installed upgrade with the original default profile and terminal launcher
        if: runner.os != 'Linux'
        run: node tooling/upgrade-package-check.mjs
      - name: Exercise the original Linux AppImage path and default profile
        if: runner.os == 'Linux'
        run: xvfb-run -a node tooling/upgrade-package-check.mjs
      - name: Retain upgrade evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: upgrade-acceptance-${{ matrix.target }}-${{ github.sha }}
          path: |
            test-results/upgrade-acceptance/${{ matrix.target }}/report.json
            test-results/upgrade-acceptance/${{ matrix.target }}/*.png
            test-results/upgrade-acceptance/${{ matrix.target }}/artwork/*
          if-no-files-found: error
          retention-days: 30
