name: Windows development checks

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      suite:
        description: 'Quick checks or full rendering and package verification'
        required: true
        default: quick
        type: choice
        options: [quick, full]
      upload_package:
        description: 'Upload the unpacked app after reviewing binary redistribution requirements'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: windows-${{ github.workflow }}-${{ github.ref }}-${{ inputs.suite || (startsWith(github.ref, 'refs/tags/') && 'full' || 'quick') }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')) }}

jobs:
  # Preserve the existing final check name for branch protection.
  validate:
    runs-on: windows-latest
    timeout-minutes: ${{ (inputs.suite == 'full' || startsWith(github.ref, 'refs/tags/')) && 240 || 60 }}
    env:
      ROARR_LOG: 'false'
      CI_SUITE: ${{ inputs.suite || (startsWith(github.ref, 'refs/tags/') && 'full' || 'quick') }}
      CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Formatting, lint, types, unit tests and CI plan checks
        run: pnpm check
      - name: Decide whether desktop checks are needed
        id: scope
        run: node tooling/windows-ci.mjs classify
      - name: Build once
        if: steps.scope.outputs.desktop == 'true'
        run: pnpm build
      - name: Package once for full verification
        if: env.CI_SUITE == 'full'
        run: pnpm --filter @gleech/desktop pack:win
      - name: Essential desktop workflows
        if: steps.scope.outputs.desktop == 'true' && env.CI_SUITE == 'quick'
        run: node tooling/windows-ci.mjs quick
      - name: Verify packaged native binaries and dependency notices
        if: env.CI_SUITE == 'full'
        run: |
          node tooling/native-release-check.mjs apps/desktop/release/win-unpacked
          node tooling/build-tool-review.mjs apps/desktop/release/win-unpacked
      - name: Full built and packaged workflows
        if: env.CI_SUITE == 'full'
        run: node tooling/windows-ci.mjs full --packaged apps/desktop/release/win-unpacked/GLEECH.exe
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: success() && env.CI_SUITE == 'full' && inputs.upload_package
        with:
          name: gleech-windows-development
          path: apps/desktop/release/win-unpacked
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: desktop-diagnostics
          path: test-results
          if-no-files-found: ignore
          retention-days: 3
