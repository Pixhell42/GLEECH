name: macOS alpha builds

on:
  workflow_dispatch:
  pull_request:
    paths:
      - apps/desktop/src/**
      - packages/**
      - tooling/support-check.mjs
      - tooling/github-feedback-check.mjs
      - tooling/updates-check.mjs
      - tooling/terminal-updates-check.mjs
      - tooling/update-package-*.mjs
      - .github/workflows/macos.yml
      - apps/desktop/electron-builder.yml
      - apps/desktop/package.json
      - apps/desktop/src/main/subject-detection.ts
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - tooling/mac-*.mjs
      - tooling/*ffmpeg*.mjs
      - apps/desktop/build/ffmpeg-before-pack.mjs
      - apps/desktop/build/after-pack.mjs
      - apps/desktop/src/main/ffmpeg*.ts
      - LICENSES/ffmpeg/**
      - tooling/cli-*.mjs
      - apps/desktop/build/cli-after-pack.mjs
      - apps/desktop/resources/cli/**
      - apps/desktop/src/cli/**
      - apps/desktop/src/main/cli-gpu-main.ts
      - apps/desktop/src/preload/cli-gpu.ts
      - apps/desktop/src/renderer/cli-gpu.html
      - apps/desktop/src/renderer/src/cli-gpu.ts
      - apps/desktop/src/shared/cli-gpu-api.ts
      - apps/desktop/cli.vite.config.ts

permissions:
  contents: read

env:
  ROARR_LOG: 'false'
  CSC_IDENTITY_AUTO_DISCOVERY: 'false'

concurrency:
  group: macos-alpha-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: macOS ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
            app: apps/desktop/release/mac-arm64/GLEECH.app
          - arch: x64
            runner: macos-15-intel
            app: apps/desktop/release/mac/GLEECH.app
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Require native build architecture
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: node -e "require('node:assert/strict').equal(process.platform, 'darwin'); require('node:assert/strict').equal(process.arch, process.env.EXPECTED_ARCH)"
      - run: pnpm install --frozen-lockfile
      - name: Check production dependency advisories
        run: pnpm audit --prod
      - name: Build native Mac ZIP
        run: pnpm dist:mac
      - name: Verify native binaries, original notices and ZIP
        run: node tooling/mac-package-check.mjs
      - name: Formatting, lint, types and unit tests
        run: pnpm check
      - name: Test the packaged app
        env:
          GLEECH_MAC_APP: ${{ matrix.app }}
        run: |
          gleech_executable="$GLEECH_MAC_APP/Contents/MacOS/GLEECH"
          node tooling/ffmpeg-package-check.mjs "$GLEECH_MAC_APP/Contents/Resources"
          node tooling/update-package-check.mjs "$GLEECH_MAC_APP/Contents/Resources" apps/desktop/release
          node tooling/ffmpeg-check.mjs "$gleech_executable"
          node tooling/smoke.mjs "$gleech_executable"
          node tooling/image-check.mjs "$gleech_executable" --cpu
          node tooling/mcp-check.mjs "$gleech_executable" --cpu
          node tooling/mcp-clients-check.mjs "$gleech_executable"
          node tooling/cli-check.mjs "$gleech_executable" --cpu --require-ffmpeg
          node tooling/cli-launcher-check.mjs "$GLEECH_MAC_APP"
          node tooling/updates-check.mjs "$gleech_executable"
          node tooling/terminal-updates-check.mjs "$gleech_executable"
          node tooling/open-file-check.mjs "$gleech_executable"
          node tooling/support-check.mjs "$gleech_executable" --cpu
          node tooling/github-feedback-check.mjs "$gleech_executable" --cpu --allow-unavailable-keyring
      - name: Upload verified alpha package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gleech-macos-alpha-${{ matrix.arch }}-${{ github.sha }}
          path: |
            apps/desktop/release/GLEECH-*-mac-${{ matrix.arch }}.zip
            apps/desktop/release/mac-build-${{ matrix.arch }}.json
            apps/desktop/release/SHA256SUMS-mac-${{ matrix.arch }}.txt
            apps/desktop/release/latest-${{ matrix.arch }}-mac.yml
            apps/desktop/release/*.blockmap
          if-no-files-found: error
          retention-days: 14
