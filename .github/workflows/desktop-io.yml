name: Desktop file IO diagnostics

on:
  pull_request:
    paths:
      - '.github/workflows/desktop-io.yml'
      - 'tooling/desktop-io-check.mjs'
      - 'tooling/test-io-tracing.mjs'
      - 'tooling/record-desktop-failure.mjs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-io-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      ROARR_LOG: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: node tooling/desktop-io-check.mjs
      - run: node tooling/preset-transfer-check.mjs --cpu
      - run: node tooling/mcp-check.mjs --cpu
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: desktop-file-io
          path: |
            test-results/desktop-io
            test-results/preset-transfer-check
            test-results/mcp-check
            !test-results/**/*profile*/**
            !test-results/preset-transfer-check/*-source-*/**
            !test-results/preset-transfer-check/*-destination-*/**
            !test-results/**/mcp-connection.json
            !test-results/**/Local State
          retention-days: 3
