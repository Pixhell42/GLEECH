name: Published 0.2.0 to latest updater acceptance

on:
  workflow_dispatch:
  release:
    types: [published]
  pull_request:
    paths:
      - .github/workflows/published-upgrade-acceptance.yml
      - tooling/published-upgrade-*.mjs

permissions:
  contents: read

concurrency:
  group: published-upgrade-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  release-ready:
    name: Check published release assets
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.ready.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
      - name: Verify all four release downloads are live
        id: ready
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PUBLISHED_RELEASE_TAG: ${{ github.event.release.tag_name }}
          PUBLISHED_RELEASE_ID: ${{ github.event.release.id }}
        run: node tooling/published-upgrade-release-gate.mjs >> "$GITHUB_OUTPUT"

  native:
    name: Published upgrade ${{ matrix.target }}
    needs: release-ready
    if: ${{ !cancelled() && (github.event_name != 'release' || (needs.release-ready.result == 'success' && needs.release-ready.outputs.version != '')) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      EXPECTED_RELEASE_VERSION: ${{ needs.release-ready.outputs.version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: win32-x64
            runner: windows-latest
          - target: darwin-arm64
            runner: macos-15
          - target: darwin-x64
            runner: macos-15-intel
          - target: linux-x64
            runner: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Linux desktop prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libfuse2 xvfb libgtk-3-0 libnss3 libasound2
      - name: Update the published installation through public GitHub transport
        if: runner.os != 'Linux'
        env:
          EXPECTED_TARGET: ${{ matrix.target }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node tooling/published-upgrade-check.mjs
      - name: Update the published AppImage through public GitHub transport
        if: runner.os == 'Linux'
        env:
          EXPECTED_TARGET: ${{ matrix.target }}
          GITHUB_TOKEN: ${{ github.token }}
        run: xvfb-run -a node tooling/published-upgrade-check.mjs
      - name: Summarize live updater results
        if: always()
        shell: bash
        env:
          EXPECTED_TARGET: ${{ matrix.target }}
        run: |
          output="test-results/published-upgrade/$EXPECTED_TARGET"
          mkdir -p "$output"
          report="$output/report.json"
          if [[ ! -f "$report" ]]; then report=/dev/null; fi
          node tooling/published-upgrade-summary.mjs < "$report" | tee "$output/summary.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Retain public upgrade evidence (no installers or user profiles)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: published-upgrade-${{ matrix.target }}-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            test-results/published-upgrade/${{ matrix.target }}/report.json
            test-results/published-upgrade/${{ matrix.target }}/summary.md
            test-results/published-upgrade/${{ matrix.target }}/*.png
            test-results/published-upgrade/${{ matrix.target }}/*.log
            test-results/published-upgrade/${{ matrix.target }}/artwork/*
          if-no-files-found: error
          retention-days: 30
