name: Feature request
description: Suggest an improvement to GLEECH.
title: '[Feature] '
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would this help you do?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the interaction or visual result you want.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Existing workarounds or related features
