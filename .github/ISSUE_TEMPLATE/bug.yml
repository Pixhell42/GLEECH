name: Bug report
description: Report an issue with GLEECH.
title: '[Bug] '
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "For security vulnerabilities, use SECURITY.md's private reporting channel. Do not attach credentials or private artwork. The native Bug Report panel can submit your version automatically."
  - type: input
    id: version
    attributes:
      label: GLEECH version
      description: Copy the version from the bottom of the hamburger menu.
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: OS and graphics hardware
      placeholder: Windows version, GPU/driver, CPU fallback if applicable
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Include affected effects/settings and whether a fresh project reproduces it.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
  - type: textarea
    id: evidence
    attributes:
      label: Optional screenshots or safe sample
      description: Share only files you have permission to publish; remove personal data.
